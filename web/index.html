<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/sentrix-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050b18" />
    <title>SENTRIX | Security Operations Console</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("sentrix-settings") || "{}");
        var t = s.theme || "dark";
        var light = t === "light" || (t === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
        if (light) document.documentElement.classList.add("light");
        document.documentElement.setAttribute("data-density", s.density || "spacious");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
